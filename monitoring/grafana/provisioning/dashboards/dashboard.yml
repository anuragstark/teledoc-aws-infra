# ============================================
# Grafana — Auto-provision dashboards
# ============================================
apiVersion: 1

providers:
  - name: 'TeleDoc Dashboards'
    orgId: 1
    folder: 'TeleDoc'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
