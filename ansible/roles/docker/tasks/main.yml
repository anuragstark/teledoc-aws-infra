# ============================================
# TeleDoc — Docker Installation Role (Tasks)
# ============================================
# Installs Docker & Docker Compose on Amazon Linux 2023
# Idempotent — safe to run multiple times
# ============================================
---
- name: Install Docker
  dnf:
    name: docker
    state: present

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add ec2-user to docker group
  user:
    name: ec2-user
    groups: docker
    append: yes

- name: Create Docker CLI plugins directory
  file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: '0755'

- name: Install Docker Compose v2
  get_url:
    url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: '0755'

- name: Create docker-compose symlink
  file:
    src: /usr/local/lib/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false

- name: Verify Docker Compose installation
  command: docker-compose --version
  register: compose_version
  changed_when: false

- name: Print Docker version
  debug:
    msg: "Docker: {{ docker_version.stdout }}, Compose: {{ compose_version.stdout }}"
