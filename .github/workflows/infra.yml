# ============================================
# TeleDoc - Infrastructure Management
# ============================================
# Runs Terraform + Ansible from GitHub Actions
# No local machine required!
#
# Actions:
#   plan    -> Preview infrastructure changes
#   apply   -> Create/update infrastructure + run Ansible setup
#   destroy -> Tear down everything
# ============================================

name:  Infrastructure (Terraform + Ansible)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      run_ansible:
        description: 'Run Ansible after apply? (ignored for plan/destroy)'
        required: false
        type: boolean
        default: true

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform
  ANSIBLE_HOST_KEY_CHECKING: "False"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ============================================
  # Terraform: Plan / Apply / Destroy
  # ============================================
  terraform:
    name: " Terraform ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest
    outputs:
      monitor_server_ip: ${{ steps.outputs.outputs.monitor_server_ip }}
      rds_endpoint: ${{ steps.outputs.outputs.rds_endpoint }}
      rds_hostname: ${{ steps.outputs.outputs.rds_hostname }}
      ecr_registry: ${{ steps.outputs.outputs.ecr_registry }}
      alb_dns_name: ${{ steps.outputs.outputs.alb_dns_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ---- PLAN ----
      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -var="my_ip=${{ secrets.MY_IP }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="app_key=${{ secrets.APP_KEY }}"

      # ---- APPLY ----
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -var="my_ip=${{ secrets.MY_IP }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="app_key=${{ secrets.APP_KEY }}"

      # ---- DESTROY ----
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -var="my_ip=${{ secrets.MY_IP }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="app_key=${{ secrets.APP_KEY }}"

      # ---- Extract Outputs (only on apply) ----
      - name: Get Terraform Outputs
        id: outputs
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "monitor_server_ip=$(terraform output -raw monitor_server_public_ip)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "rds_hostname=$(terraform output -raw rds_hostname)" >> $GITHUB_OUTPUT
          echo "ecr_registry=$(terraform output -raw ecr_registry)" >> $GITHUB_OUTPUT
          echo "alb_dns_name=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT

          echo "============================================"
          echo " Infrastructure Outputs:"
          echo "============================================"
          echo "  Monitor Server IP: $(terraform output -raw monitor_server_public_ip)"
          echo "  RDS Endpoint:      $(terraform output -raw rds_endpoint)"
          echo " ALB DNS:           $(terraform output -raw alb_dns_name)"
          echo " ECR Registry:      $(terraform output -raw ecr_registry)"
          echo " Grafana URL:       $(terraform output -raw grafana_url)"
          echo "============================================"

  # ============================================
  # Ansible: Configure Servers (only on apply)
  # ============================================
  ansible:
    name: " Ansible Setup"
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event.inputs.action == 'apply' && github.event.inputs.run_ansible == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/teledoc.pem
          chmod 400 ~/.ssh/teledoc.pem

      # ---- Wait for EC2 instances to be ready ----
      - name: Wait for EC2 instances to boot
        run: |
          echo " Waiting 60s for EC2 user-data scripts to complete..."
          sleep 60

          echo " Testing SSH connectivity to Monitor server..."
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -i ~/.ssh/teledoc.pem ec2-user@${{ needs.terraform.outputs.monitor_server_ip }} \
              "echo 'SSH OK'" 2>/dev/null; then
              echo " Monitor server reachable!"
              break
            fi
            echo "Attempt $i/10 - waiting 15s..."
            sleep 15
          done

      # ---- Generate Dynamic Ansible Inventory ----
      - name: Generate Ansible Inventory
        run: |
          cat > ansible/inventory/hosts.ini << EOF
          [monitoring]
          monitor-server ansible_host=${{ needs.terraform.outputs.monitor_server_ip }}

          [all:vars]
          ansible_user=ec2-user
          ansible_ssh_private_key_file=~/.ssh/teledoc.pem
          ansible_python_interpreter=/usr/bin/python3
          EOF

          echo " Generated inventory:"
          cat ansible/inventory/hosts.ini

      # ---- Update Prometheus config with real IPs ----
      - name: Update Prometheus config with real IPs
        run: |
          sed -i "s/ALB_DNS_NAME/${{ needs.terraform.outputs.alb_dns_name }}/g" \
            monitoring/prometheus/prometheus.yml

          echo " Updated Prometheus config:"
          cat monitoring/prometheus/prometheus.yml

      # ---- Run Ansible: Setup Monitoring Server ----
      - name: Setup Monitoring Server
        working-directory: ansible
        run: |
          ansible-playbook playbooks/setup-monitoring.yml \
            -i inventory/hosts.ini \
            -v


      # ---- Print Summary ----
      - name: Deployment Summary
        run: |
          echo "============================================"
          echo " Infrastructure Setup Complete!"
          echo "============================================"
          echo ""
          echo " Website:    http://${{ needs.terraform.outputs.alb_dns_name }}"
          echo " Grafana:    http://${{ needs.terraform.outputs.monitor_server_ip }}:3000"
          echo "              (admin / teledoc123)"
          echo " Prometheus: http://${{ needs.terraform.outputs.monitor_server_ip }}:9090"
          echo ""
          echo " CNAME aws.teledoc.co.in -> ${{ needs.terraform.outputs.alb_dns_name }}"
          echo ""
